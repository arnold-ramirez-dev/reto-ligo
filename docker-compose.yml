services:
  # Desarrollo local: este es el único contenedor necesario.
  # La API NestJS y el simulador de pagos se ejecutan con Node en tu máquina.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cashin
      POSTGRES_USER: cashin
      POSTGRES_PASSWORD: cashin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashin -d cashin"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

